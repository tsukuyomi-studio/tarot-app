<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星詠みタロット | スリーカード占い</title>
<meta name="description" content="過去・現在・未来を占うスリーカード・タロット占い。大アルカナ22枚から3枚を引き、神秘的な雰囲気の中でカードをめくって結果を占うWEBアプリ。">
<meta property="og:title" content="星詠みタロット | スリーカード占い">
<meta property="og:description" content="過去・現在・未来を占うスリーカード・タロット占い。カードをめくって、あなたの運命を読み解きましょう。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05070f;
    --night: #0b1330;
    --night-2: #121c42;
    --gold: #c9a24b;
    --gold-bright: #f0d38a;
    --pale: #f5f3ee;
    --mist: #6d7aa8;
  }
  *{box-sizing:border-box;}
  html,body{
    background: var(--void);
    color: var(--pale);
    font-family: 'Noto Serif JP', serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .font-display{ font-family:'Cinzel','Noto Serif JP', serif; letter-spacing: 0.08em; }
  .gold-text{ color: var(--gold-bright); }

  /* starfield */
  .starfield{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(240,211,138,.9), transparent),
      radial-gradient(1px 1px at 68% 58%, rgba(245,243,238,.7), transparent),
      radial-gradient(1.5px 1.5px at 38% 78%, rgba(240,211,138,.8), transparent),
      radial-gradient(1px 1px at 82% 18%, rgba(245,243,238,.6), transparent),
      radial-gradient(1px 1px at 52% 12%, rgba(240,211,138,.6), transparent),
      radial-gradient(1.5px 1.5px at 8% 62%, rgba(245,243,238,.8), transparent),
      radial-gradient(1px 1px at 92% 82%, rgba(240,211,138,.7), transparent),
      radial-gradient(1px 1px at 28% 48%, rgba(245,243,238,.5), transparent),
      radial-gradient(1px 1px at 60% 90%, rgba(240,211,138,.6), transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.5;} to{opacity:1;} }

  .bg-veil{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(109,122,168,.25), transparent 60%),
      radial-gradient(ellipse 50% 45% at 50% 100%, rgba(201,162,75,.10), transparent 60%),
      linear-gradient(180deg, var(--void), var(--night) 55%, var(--void));
  }

  .divider-sigil{
    display:flex; align-items:center; justify-content:center; gap:.75rem;
    color: var(--gold);
  }
  .divider-sigil::before, .divider-sigil::after{
    content:""; height:1px; width:3rem;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .btn-gold{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #17110a;
    font-family:'Cinzel','Noto Serif JP', serif;
    letter-spacing:.1em;
    box-shadow: 0 6px 22px rgba(201,162,75,.35);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }
  .btn-gold:hover{ transform: translateY(-2px); box-shadow: 0 10px 28px rgba(201,162,75,.5); filter:brightness(1.05); }
  .btn-gold:active{ transform: translateY(0); }

  .ghost-btn{
    border:1px solid rgba(201,162,75,.5);
    color: var(--gold-bright);
    font-family:'Cinzel','Noto Serif JP', serif; letter-spacing:.1em;
    transition: background .25s ease, border-color .25s ease;
  }
  .ghost-btn:hover{ background: rgba(201,162,75,.08); border-color: var(--gold-bright); }

  /* ===== card flip ===== */
  .card-scene{ perspective: 1400px; }
  .card-flip{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition: transform 1s cubic-bezier(.22,1,.36,1);
  }
  .card-flip.is-flipped{ transform: rotateY(180deg); }
  .card-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius: 0.9rem;
    overflow:hidden;
  }
  .card-back{
    background:
      radial-gradient(circle at 50% 50%, rgba(201,162,75,.14), transparent 60%),
      linear-gradient(160deg, var(--night-2), var(--void) 80%);
    border: 1px solid rgba(201,162,75,.5);
    box-shadow: 0 0 0 1px rgba(201,162,75,.12) inset, 0 10px 30px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: box-shadow .3s ease, transform .3s ease;
  }
  .card-back:hover{
    box-shadow: 0 0 0 1px rgba(240,211,138,.3) inset, 0 0 30px rgba(201,162,75,.35), 0 10px 30px rgba(0,0,0,.55);
    transform: translateY(-3px);
  }
  .card-back svg{ width:56%; height:56%; opacity:.85; }
  .card-front{
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #16214a, #080c1e 85%);
    border: 1px solid rgba(201,162,75,.6);
    box-shadow: 0 0 0 1px rgba(201,162,75,.15) inset, 0 10px 30px rgba(0,0,0,.6);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 0.8rem;
    text-align:center;
  }
  .card-icon{
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 1.7rem;
    background: radial-gradient(circle at 35% 30%, rgba(240,211,138,.25), rgba(201,162,75,.05) 70%);
    border: 1px solid rgba(201,162,75,.5);
    transition: transform .4s ease;
  }
  .reversed .card-icon{ transform: rotate(180deg); }
  .card-numeral{
    font-family:'Cinzel', serif; color: var(--gold);
    font-size: .65rem; letter-spacing:.2em; margin-top:.5rem;
  }
  .card-name{
    font-family:'Cinzel','Noto Serif JP', serif;
    color: var(--gold-bright);
    font-size: 0.92rem; margin-top:.3rem; line-height:1.3;
  }
  .card-orientation{
    font-size: .62rem; color: var(--mist); margin-top:.25rem; letter-spacing:.15em;
  }
  .position-label{
    font-family:'Cinzel', serif; letter-spacing:.25em; color: var(--gold);
    font-size:.68rem;
  }

  .fade-in{ animation: fadeIn .8s ease both; }
  .fade-in-delay1{ animation: fadeIn .8s ease .15s both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform:none;} }

  .pulse-hint{ animation: pulseHint 2.4s ease-in-out infinite; }
  @keyframes pulseHint{ 0%,100%{ opacity:.55;} 50%{ opacity:1;} }

  .glow-line{
    height:1px; width:100%;
    background: linear-gradient(90deg, transparent, rgba(201,162,75,.6), transparent);
  }

  textarea.mystic-input{
    background: rgba(5,7,15,.6);
    border:1px solid rgba(201,162,75,.35);
    color: var(--pale);
  }
  textarea.mystic-input:focus{
    outline:none; border-color: var(--gold-bright);
    box-shadow: 0 0 0 3px rgba(201,162,75,.15);
  }
  textarea.mystic-input::placeholder{ color: rgba(245,243,238,.35); }

  .screen{ display:none; }
  .screen.active{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .card-flip, .fade-in, .fade-in-delay1, .pulse-hint, .starfield{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body class="relative min-h-screen">

<div class="starfield"></div>
<div class="bg-veil"></div>

<div class="relative z-10 min-h-screen flex flex-col items-center px-4 py-10 sm:py-14">

  <!-- Header -->
  <header class="text-center mb-10 fade-in">
    <p class="font-display text-xs sm:text-sm gold-text tracking-[0.35em] mb-2">STARLIGHT DIVINATION</p>
    <h1 class="font-display text-3xl sm:text-4xl text-[var(--pale)]">星詠み<span class="gold-text">タロット</span></h1>
    <div class="divider-sigil mt-4 mb-1"><span class="text-lg">✦</span></div>
    <p class="text-sm sm:text-base text-[var(--mist)] tracking-wide">過去・現在・未来 &mdash; 三枚引きの導き</p>
  </header>

  <!-- SCREEN 1: スタート -->
  <section id="screen-start" class="screen active w-full max-w-md fade-in-delay1 text-center">
    <div class="rounded-2xl border border-[rgba(201,162,75,.3)] bg-[rgba(11,19,48,.5)] backdrop-blur-sm p-8 shadow-[0_10px_40px_rgba(0,0,0,.5)]">
      <p class="text-2xl mb-3">🌙 ✦ 🌟</p>
      <p class="text-sm text-[var(--pale)]/80 leading-relaxed mb-5">
        静かに心を落ち着け、問いを胸に浮かべてください。<br>
        3枚のカードが、過去・現在・未来の流れを映し出します。
      </p>

      <label for="worry" class="block font-display text-xs gold-text tracking-[0.2em] mb-2 text-left">
        ✦ 占いたい悩み（任意）
      </label>
      <textarea id="worry" rows="3"
        class="mystic-input w-full rounded-lg px-4 py-3 text-sm leading-relaxed resize-none"
        placeholder="例）今の仕事を続けるべきか迷っています…"></textarea>

      <button id="btn-start" class="btn-gold w-full mt-5 py-3 rounded-lg text-sm sm:text-base font-medium">
        過去・現在・未来を占う ✦
      </button>
    </div>
  </section>

  <!-- SCREEN 2: カード展開 & 結果 -->
  <section id="screen-cards" class="screen w-full max-w-4xl">
    <div class="fade-in mb-6 text-center">
      <p id="worry-display-wrap" class="mb-4 hidden">
        <span class="block text-xs text-[var(--pale)]/60 mb-1">あなたの問い</span>
        <span id="worry-display" class="font-display text-sm sm:text-base gold-text italic"></span>
      </p>
      <p id="flip-hint" class="text-xs sm:text-sm text-[var(--mist)] pulse-hint">カードをタップして、めくってください</p>
      <div class="glow-line my-5 max-w-xs mx-auto"></div>
    </div>

    <div class="grid grid-cols-3 gap-3 sm:gap-6 max-w-3xl mx-auto">
      <div class="flex flex-col items-center gap-3">
        <span class="position-label">過去 &mdash; PAST</span>
        <div class="card-scene w-full aspect-[2/3]">
          <div class="card-flip" data-flip="0">
            <div class="card-face card-back" data-back="0">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="34" stroke="#c9a24b" stroke-width="1"/>
                <circle cx="50" cy="50" r="24" stroke="#c9a24b" stroke-width="1"/>
                <path d="M50 16 L50 84 M16 50 L84 50 M25 25 L75 75 M75 25 L25 75" stroke="#c9a24b" stroke-width="0.6"/>
                <circle cx="50" cy="50" r="4" fill="#c9a24b"/>
              </svg>
            </div>
            <div class="card-face card-front" data-front="0"></div>
          </div>
        </div>
      </div>

      <div class="flex flex-col items-center gap-3">
        <span class="position-label">現在 &mdash; PRESENT</span>
        <div class="card-scene w-full aspect-[2/3]">
          <div class="card-flip" data-flip="1">
            <div class="card-face card-back" data-back="1">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="34" stroke="#c9a24b" stroke-width="1"/>
                <circle cx="50" cy="50" r="24" stroke="#c9a24b" stroke-width="1"/>
                <path d="M50 16 L50 84 M16 50 L84 50 M25 25 L75 75 M75 25 L25 75" stroke="#c9a24b" stroke-width="0.6"/>
                <circle cx="50" cy="50" r="4" fill="#c9a24b"/>
              </svg>
            </div>
            <div class="card-face card-front" data-front="1"></div>
          </div>
        </div>
      </div>

      <div class="flex flex-col items-center gap-3">
        <span class="position-label">未来 &mdash; FUTURE</span>
        <div class="card-scene w-full aspect-[2/3]">
          <div class="card-flip" data-flip="2">
            <div class="card-face card-back" data-back="2">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="34" stroke="#c9a24b" stroke-width="1"/>
                <circle cx="50" cy="50" r="24" stroke="#c9a24b" stroke-width="1"/>
                <path d="M50 16 L50 84 M16 50 L84 50 M25 25 L75 75 M75 25 L25 75" stroke="#c9a24b" stroke-width="0.6"/>
                <circle cx="50" cy="50" r="4" fill="#c9a24b"/>
              </svg>
            </div>
            <div class="card-face card-front" data-front="2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 結果 -->
    <div id="result-box" class="mt-10 max-w-2xl mx-auto hidden">
      <div class="divider-sigil mb-6"><span class="text-lg">✦</span></div>
      <h2 class="font-display text-center text-lg sm:text-xl gold-text tracking-widest mb-6">READING</h2>

      <div id="reading-message-box" class="rounded-2xl border border-[rgba(201,162,75,.35)] bg-[rgba(11,19,48,.55)] p-6 sm:p-8 mb-8">
        <p class="font-display text-xs gold-text tracking-[0.2em] mb-3">✦ カードからのメッセージ</p>
        <p id="reading-message" class="text-sm sm:text-base leading-loose text-[var(--pale)]/90 whitespace-pre-line"></p>
      </div>

      <div id="result-summaries" class="space-y-4"></div>

      <div class="flex justify-center mt-8">
        <button id="btn-reset" class="ghost-btn px-6 py-3 rounded-lg text-sm">もう一度占う ✦</button>
      </div>
    </div>
  </section>

  <footer class="mt-auto pt-10 text-center text-[10px] text-[var(--mist)]/70 tracking-widest">
    ※ 本アプリはプロトタイプです。すべての処理はブラウザ内のJavaScriptのみで完結します（外部通信なし）。
  </footer>
</div>

<script>
/* =========================================================
   大アルカナ 22枚データ
   ========================================================= */
const MAJOR_ARCANA = [
  { num:0,  name:"愚者", en:"The Fool", icon:"🃏", up:"新しい始まり、自由、無邪気な冒険心", rev:"無謀さ、計画性の欠如、迷走" },
  { num:1,  name:"魔術師", en:"The Magician", icon:"✨", up:"創造力、意志の力、物事を動かす才覚", rev:"力の空回り、自信過剰、詐術" },
  { num:2,  name:"女教皇", en:"The High Priestess", icon:"🌙", up:"直感、静かな知恵、内なる声への信頼", rev:"直感の無視、秘密、感情の抑圧" },
  { num:3,  name:"女帝", en:"The Empress", icon:"🌸", up:"豊かさ、慈しみ、創造と実り", rev:"過保護、停滞、自己犠牲のしすぎ" },
  { num:4,  name:"皇帝", en:"The Emperor", icon:"👑", up:"秩序、安定、揺るがない意志", rev:"支配欲、頑固さ、統制の行き過ぎ" },
  { num:5,  name:"教皇", en:"The Hierophant", icon:"🔔", up:"伝統、学び、信頼できる導き", rev:"型にはまること、既成概念への反発" },
  { num:6,  name:"恋人", en:"The Lovers", icon:"💞", up:"調和、選択、心からの結びつき", rev:"すれ違い、優柔不断、価値観のズレ" },
  { num:7,  name:"戦車", en:"The Chariot", icon:"🏹", up:"前進する力、意志の勝利、集中", rev:"方向性の喪失、暴走、自制の乱れ" },
  { num:8,  name:"力", en:"Strength", icon:"🦁", up:"内なる強さ、忍耐、優しさによる克服", rev:"自信の喪失、感情のコントロール不足" },
  { num:9,  name:"隠者", en:"The Hermit", icon:"🏮", up:"内省、孤独の中の気づき、静かな探求", rev:"孤立、閉じこもり、答えの先延ばし" },
  { num:10, name:"運命の輪", en:"Wheel of Fortune", icon:"🎡", up:"転機、巡り合わせ、流れの変化", rev:"停滞、悪循環、望まぬ変化" },
  { num:11, name:"正義", en:"Justice", icon:"⚖️", up:"公正、均衡、誠実な決断", rev:"偏り、不誠実、判断の誤り" },
  { num:12, name:"吊るされた男", en:"The Hanged Man", icon:"🔄", up:"視点の転換、忍耐の先の気づき", rev:"無駄な我慢、停滞、犠牲の空回り" },
  { num:13, name:"死神", en:"Death", icon:"🥀", up:"終わりと再生、手放すことで開ける道", rev:"変化への抵抗、執着、先延ばし" },
  { num:14, name:"節制", en:"Temperance", icon:"🍷", up:"調和、バランス、穏やかな統合", rev:"不調和、極端さ、過不足" },
  { num:15, name:"悪魔", en:"The Devil", icon:"😈", up:"誘惑、執着、逃れがたい欲求との対峙", rev:"束縛からの解放、気づきによる脱却" },
  { num:16, name:"塔", en:"The Tower", icon:"🗼", up:"突然の崩壊、価値観を揺るがす衝撃", rev:"最悪期の回避、緩やかな変化への移行" },
  { num:17, name:"星", en:"The Star", icon:"⭐", up:"希望、癒し、静かな確信", rev:"希望の喪失、自信のなさ、理想と現実の乖離" },
  { num:18, name:"月", en:"The Moon", icon:"🌕", up:"不安、幻惑、見えないものへの恐れ", rev:"不安の解消、真実が見え始める兆し" },
  { num:19, name:"太陽", en:"The Sun", icon:"☀️", up:"成功、喜び、屈託のない達成感", rev:"一時的な曇り、喜びの遅れ、過信" },
  { num:20, name:"審判", en:"Judgement", icon:"📯", up:"覚醒、再生、過去を経ての決断", rev:"迷い、決断の先送り、過去への囚われ" },
  { num:21, name:"世界", en:"The World", icon:"🌍", up:"完成、達成、一つの物語の締めくくり", rev:"未完了、あと一歩の足踏み、区切りの遅れ" },
];

const POSITIONS = [
  { key:"past",    label:"過去",   en:"PAST" },
  { key:"present", label:"現在",   en:"PRESENT" },
  { key:"future",  label:"未来",   en:"FUTURE" },
];

/* =========================================================
   状態
   ========================================================= */
let drawnCards = [];
let flippedCount = 0;
let userWorry = "";

/* =========================================================
   DOM 参照
   ========================================================= */
const screenStart = document.getElementById("screen-start");
const screenCards = document.getElementById("screen-cards");
const worryTextarea = document.getElementById("worry");
const btnStart = document.getElementById("btn-start");
const btnReset = document.getElementById("btn-reset");
const worryDisplayWrap = document.getElementById("worry-display-wrap");
const worryDisplay = document.getElementById("worry-display");
const flipHint = document.getElementById("flip-hint");
const resultBox = document.getElementById("result-box");
const resultSummaries = document.getElementById("result-summaries");
const readingMessage = document.getElementById("reading-message");

/* =========================================================
   3枚をランダムに選ぶ（重複なし・正逆ランダム）
   ========================================================= */
function drawThreeCards(){
  const pool = [...MAJOR_ARCANA];
  const result = [];
  for(let i=0;i<3;i++){
    const idx = Math.floor(Math.random()*pool.length);
    const card = pool.splice(idx,1)[0];
    const reversed = Math.random() < 0.5;
    result.push({ card, reversed, position: POSITIONS[i] });
  }
  return result;
}

function toRoman(num){
  if(num === 0) return "0";
  const romans = ["I","II","III","IV","V","VI","VII","VIII","IX","X",
    "XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
  return romans[num-1] || String(num);
}

function cardMeaningText(entry){
  return entry.reversed ? entry.card.rev : entry.card.up;
}

/* =========================================================
   カード表面を描画
   ========================================================= */
function renderCardFront(slotIndex){
  const data = drawnCards[slotIndex];
  const front = document.querySelector(`[data-front="${slotIndex}"]`);
  front.classList.toggle("reversed", data.reversed);

  front.innerHTML = `
    <div class="card-icon">${data.card.icon}</div>
    <p class="card-numeral">ARCANA ${String(data.card.num).padStart(2,"0")} ・ ${toRoman(data.card.num)}</p>
    <p class="card-name">${data.card.name}<br><span class="text-[0.62rem] tracking-widest text-[var(--mist)]">${data.card.en}</span></p>
    <p class="card-orientation">${data.reversed ? "逆位置 ・ REVERSED" : "正位置 ・ UPRIGHT"}</p>
  `;
}

/* =========================================================
   カードをめくる
   ========================================================= */
function flipCard(slotIndex){
  const flipEl = document.querySelector(`[data-flip="${slotIndex}"]`);
  if(flipEl.classList.contains("is-flipped")) return;

  renderCardFront(slotIndex);
  flipEl.classList.add("is-flipped");
  flippedCount++;

  if(flippedCount === 1){
    flipHint.textContent = "残り2枚 ・ カードをタップしてください";
  } else if(flippedCount === 2){
    flipHint.textContent = "最後の1枚です ・ カードをタップしてください";
  } else if(flippedCount === 3){
    flipHint.classList.add("hidden");
    setTimeout(showResult, 700);
  }
}

/* =========================================================
   悩みキーワード → テーマ判定（ローカル処理のみ）
   ========================================================= */
const WORRY_KEYWORDS = [
  { words:["仕事","転職","キャリア","職場","上司"], theme:"仕事や役割の在り方" },
  { words:["恋愛","恋","彼","彼女","片思い","結婚","パートナー"], theme:"人との結びつきや心の距離" },
  { words:["お金","金銭","収入","貯金","経済"], theme:"豊かさの流れ" },
  { words:["家族","親","兄弟","子供"], theme:"身近な人との関係" },
  { words:["健康","体調","病気","疲れ"], theme:"心身のバランス" },
  { words:["将来","未来","人生","進路"], theme:"これから歩む道" },
];

function detectTheme(worry){
  if(!worry) return "あなたを取り巻く物語全体";
  for(const entry of WORRY_KEYWORDS){
    if(entry.words.some(w => worry.includes(w))) return entry.theme;
  }
  return "あなたが今見つめている問い";
}

function buildReadingMessage(){
  const theme = detectTheme(userWorry);
  const [past, present, future] = drawnCards;

  const worryLine = userWorry
    ? `「${userWorry}」というあなたの問いに、カードたちはこう答えています。`
    : `今宵引かれた三枚のカードが、静かに物語を紡いでいます。`;

  const pastLine = `過去には${past.card.icon} ${past.card.name}${past.reversed ? "（逆位置）" : ""}が現れ、${cardMeaningText(past)}が、今のあなたの土台を形づくってきたことを示しています。`;

  const presentLine = `現在に立つのは${present.card.icon} ${present.card.name}${present.reversed ? "（逆位置）" : ""}。これは${cardMeaningText(present)}という状態が、${theme}に色濃く影響していることの表れです。`;

  const futureLine = `そして未来を照らす${future.card.icon} ${future.card.name}${future.reversed ? "（逆位置）" : ""}は、${cardMeaningText(future)}という流れが、これから訪れる可能性を暗示しています。`;

  const closingPool = [
    "焦らず、カードが示す流れに耳を澄ませてみてください。答えはすでにあなたの中にあります。",
    "大切なのは結果を急ぐことではなく、今この瞬間の選択を丁寧に重ねることです。",
    "たとえ困難が見えても、それは変化の入り口に過ぎません。月の満ち欠けのように、物事は巡ります。",
    "この三枚が示す物語は、あなた自身がこれからどう書き換えてもよいものです。",
  ];
  const closing = closingPool[Math.floor(Math.random()*closingPool.length)];

  return `${worryLine}\n\n${pastLine}\n\n${presentLine}\n\n${futureLine}\n\n${closing}`;
}

/* =========================================================
   結果表示（ローカル処理のみ）
   ========================================================= */
function showResult(){
  readingMessage.textContent = buildReadingMessage();

  resultSummaries.innerHTML = drawnCards.map(entry => `
    <div class="rounded-xl border border-[rgba(201,162,75,.25)] bg-[rgba(11,19,48,.4)] px-5 py-4 flex items-start gap-4">
      <div class="shrink-0 font-display text-[10px] gold-text tracking-[0.2em] w-14 pt-1">
        ${entry.position.label}<br><span class="text-[var(--mist)]">${entry.position.en}</span>
      </div>
      <div>
        <p class="font-display text-sm sm:text-base gold-text">
          ${entry.card.icon} ${entry.card.name}
          <span class="text-[10px] text-[var(--mist)] ml-1 tracking-widest">
            ${entry.reversed ? "逆位置" : "正位置"}
          </span>
        </p>
        <p class="text-sm text-[var(--pale)]/80 mt-1 leading-relaxed">${cardMeaningText(entry)}</p>
      </div>
    </div>
  `).join("");

  resultBox.classList.remove("hidden");
  resultBox.classList.add("fade-in");
  resultBox.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

/* =========================================================
   画面遷移
   ========================================================= */
function startReading(){
  userWorry = worryTextarea.value.trim();
  if(userWorry){
    worryDisplay.textContent = userWorry;
    worryDisplayWrap.classList.remove("hidden");
  } else {
    worryDisplayWrap.classList.add("hidden");
  }

  drawnCards = drawThreeCards();
  flippedCount = 0;

  document.querySelectorAll(".card-flip").forEach(el => el.classList.remove("is-flipped"));
  document.querySelectorAll(".card-face.card-front").forEach(el => { el.innerHTML=""; el.classList.remove("reversed"); });
  resultBox.classList.add("hidden");
  resultBox.classList.remove("fade-in");
  flipHint.classList.remove("hidden");
  flipHint.textContent = "カードをタップして、めくってください";

  screenStart.classList.remove("active");
  screenCards.classList.add("active");
}

function resetToStart(){
  screenCards.classList.remove("active");
  screenStart.classList.add("active");
  worryTextarea.value = "";
}

/* =========================================================
   イベント登録
   ========================================================= */
btnStart.addEventListener("click", startReading);
btnReset.addEventListener("click", resetToStart);

[0,1,2].forEach(i => {
  document.querySelector(`[data-back="${i}"]`).addEventListener("click", () => flipCard(i));
});
</script>
</body>
</html>
